chamada: Instituto Ana Nery de Educação e Saúde
titulo: Gestão com eficiência, segurança e responsabilidade
apresentacao: A IANES é uma instituição sem fins lucrativos que atua na gestão de serviços de saúde e na formação e qualificação de pessoas, com compromisso com a transparência e o interesse público.
areas_intro: Unimos saúde e educação para gerar resultados concretos para a população e para os parceiros públicos.
saude_resumo: Gestão hospitalar, atenção à saúde e projetos assistenciais, com foco em qualidade, segurança do paciente e uso responsável dos recursos.
educacao_resumo: Formação, qualificação e capacitação de profissionais, além de projetos educacionais voltados às comunidades atendidas.
quem_somos_resumo: Inspirado no legado de Ana Nery, pioneira da enfermagem no Brasil, o Instituto nasce para atuar com seriedade técnica, ética e cuidado com as pessoas.
destaques:
  - Instituição não governamental e sem fins lucrativos
  - Governança com Diretoria, Conselho de Administração e Conselho Fiscal
  - Compromisso com transparência e prestação de contas
contato_titulo: Fale com a IANES
contato_texto: "Parcerias, informações institucionais ou atendimento: estamos à disposição."
